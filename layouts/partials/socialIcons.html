{{- range . }}
{{- $url := trim .url " " }}
{{- $external := or (hasPrefix $url "http://") (hasPrefix $url "https://") (hasPrefix $url "mailto:") }}
<a href="{{ $url }}" {{ if $external }}target="_blank" rel="noopener noreferrer me"{{ end }}
    title="{{ (.title | default .name) | title }}">
    {{ partial "svgs/svgs.html" . }}
</a>
{{- end }}
